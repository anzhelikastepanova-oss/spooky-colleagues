<!doctype html><html lang="ru"><head><meta name="ghost-office-build" content="2026-10-29-v3"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Кто скрывается под простыней? 👻</title><style>
:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#302445;background:#eee7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 15%,#f9e6ff,transparent 35%),radial-gradient(circle at 90% 70%,#d6c6ff,transparent 40%),#eee7ff}.app{max-width:520px;margin:auto;padding:20px 16px 50px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:14px;font-weight:900;letter-spacing:.08em;color:#7653a5}.pill{font-size:13px;background:#ffffffb8;padding:8px 12px;border-radius:20px;font-weight:700}.progress{height:9px;background:#ffffffb5;border-radius:20px;overflow:hidden;margin:15px 0 24px}.bar{height:100%;background:linear-gradient(90deg,#a375eb,#7451cb);width:0%;transition:width .45s}.panel{background:#fffdfef0;border:1px solid #ffffff;border-radius:30px;padding:20px;box-shadow:0 18px 55px #7654b226;text-align:center}h1{font-size:clamp(24px,6vw,32px);line-height:1.15;margin:8px 0 8px}p{color:#746b84;font-size:14px;line-height:1.5}.stage{width:min(100%,290px);height:340px;margin:16px auto 18px;position:relative;border-radius:22px;overflow:hidden;background:#a68ad2;box-shadow:0 8px 24px #7d60ab30}.stage img{position:absolute;width:100%;height:100%;object-fit:cover;left:0;top:0}.stage .original{opacity:0;transition:opacity .25s}.stage .ghost{transition:transform 1s cubic-bezier(.24,.85,.25,1),opacity .65s .4s;transform-origin:top center}.stage.resetting .original,.stage.resetting .ghost{transition:none!important}.stage.reveal .original{opacity:1}.stage.reveal .ghost{transform:translate(110%,-125%) rotate(23deg) scale(1.12);opacity:0}.stage::after{content:'✦';position:absolute;top:8%;right:8%;font-size:26px;color:#ffebff;pointer-events:none}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.answer{min-height:54px;padding:12px 8px;border:2px solid #e9def9;background:#f9f6ff;color:#493566;border-radius:15px;font-size:15px;font-weight:750;cursor:pointer;transition:.2s}.answer:not(:disabled):hover{border-color:#9a77db;transform:translateY(-2px)}.answer:disabled{cursor:default}.answer.correct{background:#d8f5e5;border-color:#49b47b;color:#14663d}.answer.wrong{background:#ffe1e8;border-color:#e87898;color:#8c2544}.main{width:100%;border:0;border-radius:17px;padding:16px;background:#8056cf;color:white;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 7px 18px #8056cf4a}.main:disabled{opacity:.5;cursor:not-allowed}.feedback{min-height:45px;font-weight:800;font-size:16px;line-height:1.4}.feedback .answer-name{display:block;margin-top:7px;font-size:14px;font-weight:700}.hidden{display:none!important}.intro-ghost{font-size:95px;margin:22px 0}.score{font-size:70px;font-weight:950;color:#8056cf;line-height:1.2;margin:25px 0 5px}.tiny{font-size:12px;color:#9384a9}.spark{position:fixed;pointer-events:none;font-size:26px;animation:float 3s infinite alternate ease-in-out;opacity:.5}@keyframes float{to{transform:translateY(-20px) rotate(15deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Prevent accidental selection while playing */
html,body,button,.app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;user-drag:none}
/* Floating Halloween friends stay behind the interactive content */
.spooky-scene{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.app{position:relative;z-index:1}
.spooky{position:absolute;display:block;opacity:.46;filter:drop-shadow(0 7px 10px #8760aa30);animation:spooky-drift var(--duration,6s) ease-in-out infinite alternate;animation-delay:var(--delay,0s);font-size:var(--size,34px);line-height:1}
@keyframes spooky-drift{0%{transform:translate3d(0,8px,0) rotate(-9deg)}50%{transform:translate3d(9px,-12px,0) rotate(7deg)}100%{transform:translate3d(-8px,-28px,0) rotate(-5deg)}}
@media(max-width:650px){.spooky{opacity:.27;font-size:calc(var(--size,34px) * .78)}}

/* Keep feedback above the next button with enough breathing room */
#game .answers{margin-bottom:12px}
#game .feedback{min-height:65px;margin:0 0 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#game .feedback .answer-name{margin-top:3px}
#game #next{margin-top:0}
/* Put the final explanation closer to the rank */
#finish #rank{margin-bottom:5px}
#finish #message{margin-top:3px;margin-bottom:22px}
/* Answer status is communicated by both color and a visible icon */
.answer{position:relative;padding-left:23px;padding-right:23px}
.answer-mark{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:19px;font-weight:900;line-height:1}
.answer.correct .answer-mark{color:#14663d}
.answer.wrong .answer-mark{color:#8c2544}

/* Compact unanswered state: keep the button on screen. */
#game{display:flex;flex-direction:column;transition:padding .35s ease}
#game .stage{height:clamp(210px, 34vh, 340px);width:min(100%,290px);flex-shrink:0;transition:height .42s ease,margin .42s ease}
#game .answers{margin:10px 0 10px;transition:margin .42s ease}
#game .feedback{min-height:0;height:0;overflow:hidden;margin:0;opacity:0;transition:height .42s ease,margin .42s ease,opacity .25s ease}
#game #next{margin-top:8px;transition:margin .42s ease,transform .42s ease}
#game.has-feedback .stage{height:clamp(240px, 40vh, 340px)}
#game.has-feedback .feedback{height:85px;margin:8px 0 12px;opacity:1}
#game.has-feedback .answers{margin:14px 0 12px}
@media(max-height:780px){#game .stage{height:clamp(185px,30vh,270px)}#game.has-feedback .stage{height:clamp(210px,35vh,310px)}#game h1{margin:4px 0}#game p{margin:5px 0}#game{padding:14px}}
@media(prefers-reduced-motion:reduce){#game .stage,#game .feedback,#game #next{transition:none}}

let wrongQueue=[],correctQueue=[];
function takePhrase(isCorrect,person){
  const queue=isCorrect?correctQueue:wrongQueue;
  const pool=isCorrect?correctPhrases:wrongPhrases;
  if(!queue.length)queue.push(...shuffle([...Array(pool.length).keys()]));
  const phraseIndex=queue.pop();
  const female=[0,2,4,5,6].includes(person);
  const gendered={
    'w0':['Бу! Испугался? Не бойся! Я друг!','Бу! Испугалась? Не бойся! Я друг!'],
    'w4':['Хе-хе! А ты меня не узнал!','Хе-хе! А ты меня не узнала!'],
    'w6':['Бу-бу-бу! А вот и не угадал!','Бу-бу-бу! А вот и не угадала!'],
    'c1':['Ну вот! А я так старательно прятался!','Ну вот! А я так старательно пряталась!'],
    'c2':['Эй! Кто разрешил тебе быть таким догадливым?','Эй! Кто разрешил тебе быть таким догадливым?'],
    'c3':['Так нечестно! Я даже простыню погладил!','Так нечестно! Я даже простыню погладила!'],
    'c7':['Бу! Хотя... ладно, ты меня раскусил!','Бу! Хотя... ладно, ты меня раскусила!']
  };
  // Реплики обращенные к игроку не должны предполагать пол игрока.
  const neutral={
    'w0':'Бу! Страшно? Не бойся! Я друг!',
    'w4':'Хе-хе! А меня-то не узнали!',
    'w6':'Бу-бу-бу! А вот и мимо!',
    'c2':'Эй! Откуда такая догадливость?',
    'c7':'Бу! Хотя... ладно, меня раскусили!'
  };
  const key=(isCorrect?'c':'w')+phraseIndex;
  if(neutral[key])return neutral[key];
  return gendered[key]?gendered[key][female?1:0]:pool[phraseIndex];
}
function show(id){['intro','game','finish'].forEach(s=>$(s).classList.toggle('hidden',s!==id))}
function start(){order=shuffle([...Array(10).keys()]);index=0;points=0;wrongQueue=[];correctQueue=[];show('game');round()}
function round(){ $('game').classList.remove('has-feedback');answered=false;const person=order[index];$('counter').textContent=`Раунд ${index+1} / 10`;$('bar').style.width=`${index*10}%`;$('stage').classList.add('resetting');$('stage').classList.remove('reveal');$('ghost').src=people[person].ghost;$('original').src=people[person].photo;void $('stage').offsetWidth;$('stage').classList.remove('resetting');$('feedback').textContent='';$('next').disabled=true;$('next').textContent='Выбери ответ';let others=shuffle([...Array(10).keys()].filter(x=>x!==person)).slice(0,3);let choices=shuffle([person,...others]);$('answers').replaceChildren();choices.forEach(n=>{let b=document.createElement('button');b.className='answer';b.textContent=names[n];b.dataset.id=n;b.onclick=()=>answer(n);$('answers').append(b)})}
function answer(n){if(answered)return;answered=true;$('game').classList.add('has-feedback');let correct=order[index];if(n===correct)points++;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;let id=Number(b.dataset.id);if(id===correct){b.classList.add('correct');b.insertAdjacentHTML('beforeend','<span class="answer-mark" aria-hidden="true">✓</span>');}else if(id===n){b.classList.add('wrong');b.insertAdjacentHTML('beforeend','<span class="answer-mark" aria-hidden="true">✕</span>');}});$('stage').classList.add('reveal');const isCorrect=n===correct;const feedback=$('feedback');feedback.replaceChildren();const phrase=document.createElement('span');phrase.textContent=takePhrase(isCorrect,correct);feedback.append(phrase);if(!isCorrect){const name=document.createElement('span');name.className='answer-name';name.textContent='Это '+names[correct]+'!';feedback.append(name);}feedback.style.color=isCorrect?'#29935d':'#ba5878';$('next').disabled=false;$('next').textContent=index===9?'Узнать результат 🏆':'Следующее привидение →'}
function next(){if(!answered)return;index++;if(index===10){$('bar').style.width='100%';$('counter').textContent='Готово!';$('score').textContent=`${points}/10`;let rank=points===10?'Корпоративный экстрасенс':points>=7?'Охотник за привидениями':points>=4?'Начинающий экзорцист':'Призрак на испытательном';$('rank').textContent=rank;$('message').textContent=points===10?'Ты узнаешь коллег даже без лица. Страшно представить, что еще ты о них знаешь.':points>=7?'Еще немного, и ты сможешь определять коллег по звуку подключения к созвону.':points>=4?'Половину команды знаешь в лицо. Остальные, видимо, просто выключили камеры.':'Пока ты разбираешься, кто есть кто, призраки уже добавили тебя в рабочий чат.';show('finish')}else round()}
$('start').onclick=start;$('restart').onclick=start;$('next').onclick=next;

for(const id of ['ghost','original']) { const im=document.getElementById(id); im.addEventListener('error',()=>{console.error('Image failed:',im.src);im.alt='Изображение не загрузилось';}); }
console.info('Ghost Office ready: GitHub Pages standalone');

</script></body></html>
